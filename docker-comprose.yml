version: "3.9"

services:
  app:
    build: .
    container_name: fintrack_pro
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - .:/app
    environment:
      - DATABASE_URL=sqlite:////app/data/fintrack.db
      - SECRET_KEY=fintrack-production-secret-change-me
      - ENABLE_SCHEDULER=true
      - DEBUG=false
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
