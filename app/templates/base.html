<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinTrack Pro{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' },
                        surface: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',800:'#1e293b',900:'#0f172a',950:'#020617' }
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.3); }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 dark:bg-surface-950 text-slate-900 dark:text-slate-100 transition-colors duration-300"
      x-data="{ dark: localStorage.getItem('theme') === 'dark' }"
      :class="{ 'dark': dark }"
      x-init="
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            dark = true; document.documentElement.classList.add('dark');
        }
        $watch('dark', val => { localStorage.setItem('theme', val ? 'dark' : 'light'); document.documentElement.classList.toggle('dark', val); });
      ">
    {% block body %}{% endblock %}

    <footer class="fixed bottom-0 left-0 right-0 text-center text-xs text-slate-500 py-2 bg-white/80 dark:bg-surface-900/80 backdrop-blur border-t border-slate-200 dark:border-slate-800 z-40">
        Поддержка:
        <a href="mailto:support@fintrack.local" class="text-primary-600 hover:underline">support@fintrack.local</a>
        · Telegram:
        <a href="https://t.me/your_support" class="text-primary-600 hover:underline" target="_blank" rel="noopener">@your_support</a>
    </footer>

    <script>lucide.createIcons();</script>
    {% block scripts %}{% endblock %}
</body>
</html>
