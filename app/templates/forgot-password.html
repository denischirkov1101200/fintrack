{% extends "base.html" %}
{% block title %}Сброс пароля — FinTrack Pro{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 pb-12 bg-slate-950">
    <div class="w-full max-w-md" x-data="forgotForm()">
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <h1 class="text-xl font-semibold mb-2">Сброс пароля</h1>
            <p class="text-sm text-slate-500 mb-6">Укажите email. Если аккаунт есть — получите ссылку для сброса.</p>
            <div x-show="msg" x-cloak class="mb-4 p-3 rounded-xl bg-emerald-50 text-emerald-700 text-sm whitespace-pre-wrap break-all" x-text="msg"></div>
            <div x-show="error" x-cloak class="mb-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm" x-text="error"></div>
            <form @submit.prevent="submit" class="space-y-4">
                <input type="email" x-model="email" required placeholder="you@email.com"
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" :disabled="loading" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold disabled:opacity-60">Отправить</button>
            </form>
            <p class="mt-4 text-center text-sm"><a href="/login" class="text-indigo-600 hover:underline">Назад ко входу</a></p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function forgotForm() {
    return {
        email: '', msg: '', error: '', loading: false,
        async submit() {
            this.loading = true; this.error = ''; this.msg = '';
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: this.email })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Ошибка');
                this.msg = data.message + (data.reset_url ? '\n' + location.origin + data.reset_url : '');
            } catch (e) { this.error = e.message; }
            finally { this.loading = false; }
        }
    }
}
</script>
{% endblock %}
