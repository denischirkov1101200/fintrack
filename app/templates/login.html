{% extends "base.html" %}
{% block title %}Вход — FinTrack Pro{% endblock %}
{% block head %}
<style>
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
@keyframes gradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
.auth-bg {
  background: linear-gradient(-45deg,#0f172a,#1e1b4b,#312e81,#0f172a);
  background-size: 400% 400%;
  animation: gradient 12s ease infinite;
}
.orb { position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:float 8s ease-in-out infinite; }
.card-in { animation: fadeUp .6s ease-out both; }
</style>
{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 pb-12 relative overflow-hidden auth-bg">
    <div class="orb w-72 h-72 bg-indigo-500 top-10 -left-10"></div>
    <div class="orb w-96 h-96 bg-violet-600 bottom-0 -right-20" style="animation-delay:2s"></div>
    <div class="orb w-64 h-64 bg-cyan-500 top-1/2 left-1/3" style="animation-delay:4s"></div>

    <div class="w-full max-w-md relative z-10 card-in" x-data="loginForm()">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur border border-white/20 text-white mb-4 shadow-2xl">
                <i data-lucide="wallet" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">FinTrack Pro</h1>
            <p class="text-indigo-200 mt-2">Умный учёт финансов</p>
        </div>

        <div class="bg-white/95 dark:bg-surface-900/95 backdrop-blur-xl rounded-3xl shadow-2xl border border-white/20 p-8">
            <h2 class="text-xl font-semibold mb-6">Вход</h2>
            <div x-show="error" x-cloak class="mb-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm" x-text="error"></div>

            <form @submit.prevent="submit" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-1.5 text-slate-600">Email</label>
                    <input type="email" x-model="email" required autocomplete="email"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        placeholder="you@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1.5 text-slate-600">Пароль</label>
                    <input type="password" x-model="password" required autocomplete="current-password"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none transition"
                        placeholder="••••••••">
                </div>
                <div class="flex justify-end">
                    <a href="/forgot-password" class="text-sm text-indigo-600 hover:underline">Забыли пароль?</a>
                </div>
                <button type="submit" :disabled="loading"
                    class="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition shadow-lg shadow-indigo-600/30 disabled:opacity-60">
                    <span x-show="!loading">Войти</span>
                    <span x-show="loading" x-cloak>Вход...</span>
                </button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-500">
                Нет аккаунта? <a href="/register" class="text-indigo-600 font-medium hover:underline">Регистрация</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function loginForm() {
    return {
        email: '', password: '', error: '', loading: false,
        async submit() {
            this.loading = true; this.error = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: this.email, password: this.password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Ошибка входа');
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                window.location.href = '/dashboard';
            } catch (e) { this.error = e.message; }
            finally { this.loading = false; }
        }
    }
}
</script>
{% endblock %}
