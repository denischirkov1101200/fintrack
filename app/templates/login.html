{% extends "base.html" %}
{% block title %}Вход — FinTrack Pro{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 dark:from-surface-950 dark:via-slate-900 dark:to-surface-950">
    <div class="w-full max-w-md" x-data="loginForm()">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-primary-600 text-white mb-4 shadow-lg shadow-primary-600/30">
                <i data-lucide="wallet" class="w-8 h-8"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight">FinTrack Pro</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Учёт финансов с аналитикой</p>
        </div>

        <div class="bg-white dark:bg-surface-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 p-8">
            <h2 class="text-xl font-semibold mb-6">Вход в аккаунт</h2>
            <div x-show="error" x-cloak class="mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 text-sm" x-text="error"></div>

            <form @submit.prevent="submit" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">Email</label>
                    <input type="email" x-model="email" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-surface-800 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition"
                        placeholder="demo@fintrack.ru">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1.5 text-slate-700 dark:text-slate-300">Пароль</label>
                    <input type="password" x-model="password" required
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-surface-800 focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none transition"
                        placeholder="••••••••">
                </div>
                <button type="submit" :disabled="loading"
                    class="w-full py-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-semibold transition shadow-lg shadow-primary-600/25 disabled:opacity-60 flex items-center justify-center gap-2">
                    <span x-show="!loading">Войти</span>
                    <span x-show="loading" x-cloak class="flex items-center gap-2">
                        <svg class="animate-spin h-5 w-5" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>
                        Вход...
                    </span>
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500">
                Нет аккаунта? <a href="/register" class="text-primary-600 hover:underline font-medium">Зарегистрироваться</a>
            </p>
            <p class="mt-3 text-center text-xs text-slate-400">Демо: demo@fintrack.ru / demo1234</p>
        </div>

        <div class="mt-6 flex justify-center">
            <button @click="dark = !dark" class="p-2 rounded-lg text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                <i data-lucide="sun" x-show="dark" class="w-5 h-5"></i>
                <i data-lucide="moon" x-show="!dark" class="w-5 h-5"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function loginForm() {
    return {
        email: 'demo@fintrack.ru',
        password: 'demo1234',
        error: '',
        loading: false,
        async submit() {
            this.loading = true;
            this.error = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: this.email, password: this.password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Ошибка входа');
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                window.location.href = '/dashboard';
            } catch (e) {
                this.error = e.message;
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
