{% extends "base.html" %}
{% block title %}Новый пароль — FinTrack Pro{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center p-4 pb-12 bg-slate-950">
    <div class="w-full max-w-md" x-data="resetForm()">
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <h1 class="text-xl font-semibold mb-6">Новый пароль</h1>
            <div x-show="error" x-cloak class="mb-4 p-3 rounded-xl bg-red-50 text-red-600 text-sm" x-text="error"></div>
            <div x-show="ok" x-cloak class="mb-4 p-3 rounded-xl bg-emerald-50 text-emerald-700 text-sm">Пароль изменён. Можно войти.</div>
            <form @submit.prevent="submit" class="space-y-4" x-show="!ok">
                <input type="password" x-model="password" required minlength="8" placeholder="Новый пароль"
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                <input type="password" x-model="password2" required minlength="8" placeholder="Повтор пароля"
                       class="w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-semibold">Сохранить</button>
            </form>
            <p class="mt-4 text-center text-sm"><a href="/login" class="text-indigo-600 hover:underline">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function resetForm() {
    const params = new URLSearchParams(location.search);
    return {
        token: params.get('token') || '',
        password: '', password2: '', error: '', ok: false,
        async submit() {
            if (this.password !== this.password2) { this.error = 'Пароли не совпадают'; return; }
            this.error = '';
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: this.token, password: this.password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Ошибка');
                this.ok = true;
            } catch (e) { this.error = e.message; }
        }
    }
}
</script>
{% endblock %}
