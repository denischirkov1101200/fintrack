{% extends "base.html" %}
{% block title %}FinTrack Pro — Учёт финансов{% endblock %}
{% block body %}
<div class="min-h-screen flex flex-col items-center justify-center p-6 bg-gradient-to-br from-slate-50 via-indigo-50 to-slate-100 dark:from-surface-950 dark:via-slate-900 dark:to-surface-950">
    <div class="text-center max-w-2xl">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-primary-600 text-white mb-6 shadow-2xl shadow-primary-600/40">
            <i data-lucide="wallet" class="w-10 h-10"></i>
        </div>
        <h1 class="text-5xl font-bold tracking-tight mb-4">FinTrack Pro</h1>
        <p class="text-xl text-slate-600 dark:text-slate-400 mb-10">Современный учёт личных финансов с мощной аналитикой</p>
        <div class="flex flex-wrap justify-center gap-4">
            <a href="/login" class="px-8 py-3.5 rounded-2xl bg-primary-600 hover:bg-primary-700 text-white font-semibold shadow-lg shadow-primary-600/30 transition">Войти</a>
            <a href="/register" class="px-8 py-3.5 rounded-2xl border-2 border-slate-300 dark:border-slate-700 hover:bg-white dark:hover:bg-surface-900 font-semibold transition">Регистрация</a>
        </div>
        <p class="mt-8 text-sm text-slate-400">Демо-аккаунт: demo@fintrack.ru / demo1234</p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    if (localStorage.getItem('access_token')) window.location.href = '/dashboard';
</script>
{% endblock %}
